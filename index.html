<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1b201b">
<title>DAMAGE BREAKER</title>
<style>:root{color-scheme:dark;--ink:#eaddc4;--sub:#b8af98;--gold:#d1b77b;--edge:#766348;--bg:#101512;--paper:#22271f;--jade:#a6d7bb;--red:#ef9d83;font:15px/1.5 Georgia,"Yu Mincho",serif}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0,#303a2b,transparent 68%),repeating-linear-gradient(118deg,#ffffff02 0 1px,transparent 1px 5px),var(--bg);color:var(--ink);min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:#2b3328;border:1px solid var(--edge);padding:.56rem .95rem;border-radius:2px}
button:hover:not(:disabled),button:focus-visible{background:#424a34;border-color:var(--gold);outline:1px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.43;cursor:default}
input,select{background:#151c16;border:1px solid var(--edge);padding:.55rem;max-width:100%}
h1,h2,h3,p{margin:0}
header{height:65px;border-bottom:1px solid var(--edge);background:#151b16e8;display:flex;justify-content:space-between;align-items:center;padding:0 clamp(16px,4vw,60px);gap:12px}
.brand{letter-spacing:.21em;font-size:16px;color:var(--gold);white-space:nowrap}
header nav,.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header button{padding:.35rem .65rem}
main{max-width:1450px;margin:auto;padding:24px clamp(14px,3vw,42px) 32px}
.frame{border:1px solid var(--edge);background:linear-gradient(150deg,#2b3026,#1a211a 58%);box-shadow:inset 0 0 0 4px #10150f66,0 12px 25px #0003;padding:16px;min-width:0}
.title{display:grid;grid-template-columns:1.2fr 1fr;align-items:center;min-height:calc(100vh - 124px);padding:clamp(24px,6vw,100px);position:relative;overflow:hidden}
.title h1{font-size:clamp(49px,8vw,120px);line-height:.9;letter-spacing:-.055em;color:#f1dfb6;text-shadow:0 4px #10150f;position:relative}
.title p{margin:24px 0;color:var(--sub)}
.title form{display:flex;flex-wrap:wrap;align-items:end;gap:12px}
.title label{display:grid;gap:4px}
.title canvas{width:100%;filter:drop-shadow(0 15px 24px #000);max-height:560px;object-fit:contain}
.caption,.eyebrow{color:var(--gold);letter-spacing:.18em;font-size:12px}
.rule{margin:12px 0 22px;width:76px;height:1px;background:var(--gold)}
.primary{background:#d1b77b;color:#222418;border-color:#e9d199;font-weight:bold}
.primary:hover:not(:disabled){background:#f0d69a}
.battle{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) 247px}
.column,aside{display:grid;gap:12px;align-content:start;min-width:0}
.enemy{display:grid;grid-template-columns:minmax(180px,40%) 1fr;align-items:center;min-height:210px;padding:0 24px 0 10px;overflow:hidden;background:radial-gradient(ellipse at 24% 50%,#56604555,transparent 49%),#20271e}
.enemy canvas{width:100%;height:209px;object-fit:contain}
.enemy h1{font-size:clamp(22px,3vw,40px);line-height:1.2;margin:4px 0 8px}
.hpBar{height:7px;border:1px solid #8f7961;background:#111713;margin:4px 0}
.hpBar span{display:block;height:100%;background:linear-gradient(90deg,#a56b4e,#e4a187)}
.intent{color:var(--red);border-top:1px solid #74634966;margin-top:9px;padding-top:7px}
.heading{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:9px}
.heading h2,aside h2{font-size:17px;font-weight:normal;color:#f0dfba}
.board{display:flex;align-items:stretch;gap:5px;flex-wrap:wrap;min-height:67px}
.slot{min-width:59px;min-height:64px;padding:5px 8px;display:grid;place-content:center;text-align:center;max-width:100%;overflow-wrap:anywhere}
.empty{border:1px dashed #8b7a526f;color:#ad9e7d;background:#161e16;font-size:12px}
.base{border:1px solid #8e774d;color:#ead4a0;background:#2c2d20}
.debuff{border:1px solid #a47060;color:var(--red);background:#4a2c29}
.selected{outline:2px solid #fae7b4;outline-offset:2px}
.preview{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px;border-top:1px solid #79664880;margin-top:12px;padding-top:9px}
.preview div{min-width:0}
.preview strong{display:block;font-size:20px;color:var(--jade);overflow-wrap:anywhere;line-height:1.25}
small,.muted{color:var(--sub)}
.hand{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.card{position:relative;min-width:0;min-height:86px;background:linear-gradient(145deg,#3a3e2c,#242d23);border-color:var(--tone,var(--edge));padding:6px;overflow-wrap:anywhere}
.card strong{display:block;font-size:clamp(16px,2vw,27px);line-height:1.2}
.card small{display:block;font-size:9px;letter-spacing:.08em;color:var(--tone,var(--sub))}
.card em{font-style:normal;font-size:11px;color:var(--sub)}
.t0{--tone:#b9ac8b}.t1{--tone:#90c4a0}.t2{--tone:#97c9e5}.t3{--tone:#d5a8dd}.t4{--tone:#f5c06b}
.controls{display:flex;justify-content:space-between;gap:12px;margin-top:12px;flex-wrap:wrap}
.energy{color:var(--gold)}
aside .frame{padding:14px}
.rune{border:0;border-bottom:1px solid #8b79523d;background:none;text-align:left;padding:8px 0;width:100%;color:#dbc996}
.rune small{display:block;color:var(--jade)}
.data{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.data b,.record{color:var(--jade);overflow-wrap:anywhere}
.chapter{max-width:940px;margin:auto;padding:clamp(18px,4vw,50px)}
.chapter h1{font-size:clamp(30px,5vw,54px);line-height:1.2;margin:6px 0 14px}
.chapter h2{margin:18px 0 9px;font-size:18px}
.choices{display:flex;gap:9px;flex-wrap:wrap;margin:8px 0 15px}
.choices .card{min-width:115px}
.choices button{max-width:100%;text-align:left}
.choices button small{display:block}
dialog{background:#222a20;color:var(--ink);border:1px solid var(--gold);max-width:min(740px,95vw);width:100%;max-height:82vh;padding:23px;overflow-wrap:anywhere}
dialog::backdrop{background:#0b110bd9}
dialog li{margin:6px 0}
#effect{position:fixed;z-index:5;inset:0;display:none;place-items:center;pointer-events:none;text-align:center;font-weight:bold;font-size:clamp(30px,8vw,105px);color:#ffe2a1;text-shadow:0 0 25px #ff9b39,0 3px #3d271a;overflow:hidden;padding:20px;overflow-wrap:anywhere}
#effect.flash{display:grid;animation:burst .62s both;background:radial-gradient(ellipse,#e7b76530,transparent 70%)}
#effect.high{background:radial-gradient(ellipse,#b489dc77,transparent 75%);color:#ffeaff;text-shadow:0 0 26px #e288ff}
#effect.shake{animation:quake .78s both}
#effect.fast{animation-duration:.24s}
@keyframes burst{0%{opacity:0;transform:scale(.96)}25%{opacity:1;transform:scale(1)}100%{opacity:0}}
@keyframes quake{0%{opacity:0;transform:translateX(-8px) scale(.96)}16%{opacity:1;transform:translateX(8px)}28%{transform:translateX(-5px)}44%{transform:translateX(0)}100%{opacity:0}}
@media(max-width:850px){.battle{grid-template-columns:1fr}aside{grid-template-columns:repeat(2,1fr)}.title{grid-template-columns:1fr}.title canvas{max-height:250px;grid-row:1}}
@media(max-width:490px){header{height:auto;padding:10px;flex-wrap:wrap}.hand{gap:4px}.card{padding:3px}.card small{letter-spacing:0;font-size:8px}.enemy{grid-template-columns:90px 1fr;padding:7px;min-height:145px}.enemy canvas{height:120px}.preview strong{font-size:16px}.frame{padding:10px}}
@media(prefers-reduced-motion:reduce){#effect.flash{animation-duration:.18s}}
#effect[data-tier="1"]{text-shadow:0 0 30px #ffd999,0 4px #523717}
#effect[data-tier="2"],#effect[data-tier="3"]{background:radial-gradient(ellipse,#f9c47566,transparent 72%)}
#effect[data-tier="5"]{background:radial-gradient(ellipse,#b04c6066,transparent 70%);color:#ffe2ce}
#effect[data-tier="6"],#effect[data-tier="7"]{background:repeating-conic-gradient(from 15deg at center,#c495ed30 0 3deg,transparent 8deg 25deg),radial-gradient(ellipse,#7d4da5b3,transparent 75%)}

/* The spine separates the illuminated chapter from the margin notes. */
:root{--display:Georgia,"Yu Mincho","Hiragino Mincho ProN",serif;--interface:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif}
body{background:radial-gradient(ellipse at 50% -10%,#4b4841 0,transparent 62%),repeating-linear-gradient(118deg,#ffffff02 0 1px,transparent 1px 5px),#151519}
header{background:#1e1c22;border-color:#746144}
.heading h2,aside h2{letter-spacing:.1em}
main{position:relative;perspective:1300px}
.battle{grid-template-columns:minmax(0,1fr) 252px}
.battle .column{position:relative}
.battle .column::after{content:"";position:absolute;top:0;bottom:0;right:-8px;width:1px;background:linear-gradient(transparent,#967c4a,transparent)}
.frame{background:linear-gradient(145deg,#34302b,#211f25 72%);border-color:#82694c;box-shadow:inset 0 0 0 4px #14121890,0 8px 20px #0004}
.eyebrow,.caption{color:#e0bd80}
.enemy{grid-template-columns:minmax(0,1.55fr) minmax(210px,1fr);min-height:224px;padding:12px 20px 12px 12px;
  --arena:#825e58;--mist:#e7a770;position:relative;isolation:isolate;gap:18px}
.enemy[data-act="2"]{--arena:#485f65;--mist:#a0cfbf}
.enemy[data-act="3"]{--arena:#6b435e;--mist:#eba4bd}
.enemy[data-act="4"]{--arena:#544279;--mist:#c6a1ff}
.duel{min-width:0;position:relative;display:grid;grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr);
  align-items:end;isolation:isolate;border:1px solid #c49b582e;overflow:hidden;padding:5px 10px 9px;
  background:radial-gradient(ellipse at 50% 60%,var(--arena),transparent 63%),
    repeating-linear-gradient(90deg,transparent 0 3px,#100f161e 3px 4px),#17151f}
.duel::before{content:"";z-index:-1;position:absolute;inset:0;background:linear-gradient(transparent 65%,#17121d 65%,#24202a 76%,#130f18 95%);opacity:.72}
.combatant{min-width:0;margin:0;text-align:center}
.combatant canvas{width:auto;height:132px;max-width:100%;object-fit:contain;image-rendering:pixelated;display:block;margin:auto;
  filter:drop-shadow(0 0 9px color-mix(in srgb,var(--mist),transparent 50%))}
.combatant figcaption{font:600 13px var(--interface);color:#f7e5c0;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.arena-seal{align-self:center;color:var(--mist);font-size:25px;opacity:.55;text-align:center}
.hpBar span{transition:width .25s ease-out}
.hero-hp span{background:linear-gradient(90deg,#447e73,#a6ddba)}
.foe-hp span{background:linear-gradient(90deg,#8d435f,#eea08b)}
.enemy-info{min-width:0}
.enemy-info h1{font-size:clamp(24px,2.7vw,44px);letter-spacing:.035em;line-height:1.12}
.enemy-title{letter-spacing:.12em}
.enemy .intent{background:#16141ce8;border:1px solid #ac766755;padding:8px 10px;border-left:3px solid #ca8e76}
.intent small,.intent strong{display:block}
.intent strong{font:600 14px/1.45 var(--interface);color:#ffc9ad}
#incoming{opacity:0;position:absolute;z-index:2;left:6%;top:20%;color:#ffd0b0;font:bold 14px var(--interface);text-shadow:0 2px 4px #000;padding:4px;background:#1b1521}
.enemy-strike #incoming,.enemy-magic #incoming{animation:incoming .75s both}
@keyframes incoming{0%{transform:translateY(10px);opacity:0}20%,70%{opacity:1}100%{transform:translateY(-10px);opacity:0}}
.charging .hero canvas{animation:charge .62s ease-in-out infinite alternate}
@keyframes charge{to{filter:brightness(1.55) drop-shadow(0 0 16px #b4f9dd);transform:translateY(-3px)}}
.player-strike .hero canvas{animation:lunge-hero .36s both}
.player-strike .foe canvas,.enemy-strike .hero canvas{animation:recoil .42s both}
.enemy-strike .foe canvas{animation:lunge-foe .36s both}
.enemy-strike .hero canvas{animation-name:recoil-hero}
.enemy-magic .foe canvas{animation:charge .3s ease-in-out 2 alternate}
@keyframes lunge-hero{35%{transform:translateX(17px) scale(1.06)}}
@keyframes lunge-foe{35%{transform:translateX(-17px) scale(1.06)}}
@keyframes recoil{28%{transform:translateX(10px);filter:brightness(3) saturate(.5)}}
@keyframes recoil-hero{28%{transform:translateX(-10px);filter:brightness(2.7) saturate(.5)}}
.slash{opacity:0;position:absolute;top:20%;left:57%;width:38%;height:60%;pointer-events:none;
  background:linear-gradient(133deg,transparent 45%,#fff8d4 49%,#eac89b 51%,transparent 55%);filter:drop-shadow(0 0 7px #ffb870)}
.player-strike .slash{animation:slash .38s both}
@keyframes slash{0%{opacity:0;transform:scale(.4) translate(-20px,14px)}28%{opacity:1}100%{opacity:0;transform:scale(1.1) translate(12px,-8px)}}
.card{--card-land:#31283a;position:relative;isolation:isolate;overflow:hidden;min-height:116px;text-align:center;
  display:grid;grid-template-rows:22px minmax(40px,1fr) 24px;align-items:center;padding:7px 8px;border:1px solid var(--tone);
  background:radial-gradient(ellipse at 50% 53%,color-mix(in srgb,var(--tone),transparent 78%),transparent 58%),
    linear-gradient(145deg,#443746 0%,var(--card-land) 50%,#221c29 100%);
  box-shadow:inset 0 0 0 3px #160f215e,0 3px 0 #17121c}
.card:hover:not(:disabled){background-color:#594739;background-blend-mode:screen;box-shadow:inset 0 0 0 3px #d6a35a32,0 3px 0 #17121c}
.card .card-rank{display:block;color:var(--tone);font:700 10px var(--interface);letter-spacing:.09em;text-align:left;padding-left:4px;padding-right:19px}
.card .mana{position:absolute;top:7px;right:8px;display:grid;place-items:center;border:1px solid var(--tone);width:22px;height:22px;
  background:#221a29;color:#fbdfab;font:bold 13px Georgia;border-radius:50%}
.card .sigil{position:absolute;z-index:-1;inset:13px 0 0;display:grid;place-content:center;color:var(--tone);font-size:76px;line-height:1;opacity:.17}
.card .card-number{color:#fff0cb;text-shadow:0 2px #110d18;font-size:clamp(24px,3.1vw,38px);font-variant-numeric:lining-nums tabular-nums}
.card .card-type{color:#e9d6bc;font:600 11px var(--interface)}
.choices .card{min-width:140px;text-align:center}
.board .slot{min-width:62px}
.board-card{border-color:var(--tone);background:linear-gradient(145deg,#52414a,#2e2532)}
.board-card strong{font-size:22px;color:#fff0cf;font-variant-numeric:tabular-nums}
.board-card small{font:11px var(--interface)}
.board .resolving,.rune.resolving{z-index:1;outline:2px solid #ffdf9b;box-shadow:0 0 12px #ffbd55;background:#5c422d;color:#fff1b7}
.board .debuff.resolving{outline-color:#ffa39b;box-shadow:0 0 12px #fe7059}
.preview{grid-template-columns:1fr 1fr 1.25fr}
.preview div{background:#18161eaa;padding:7px 10px;border-left:1px solid #8e7555}
.preview small{font:600 11px var(--interface)}
.preview strong{font-variant-numeric:lining-nums tabular-nums}
.preview div:last-child strong{color:#ffe3a1;font-size:25px}
.calculating .preview{display:none}
.reel{--reel-gold:#ffe4a0;--reel-light:#ecb34b;position:relative;margin-top:10px;padding:9px 12px;background:radial-gradient(ellipse at 50% 110%,#94704d45,transparent 62%),#16131f;
  border:1px solid var(--reel-light);overflow:hidden;box-shadow:inset 0 0 18px #0b0911}
.reel[data-kind="enemy"]{--reel-gold:#ffb2a4;--reel-light:#a66160}
.reel[data-kind="relic"]{--reel-gold:#f3d8ff;--reel-light:#bc8beb}
.reel[data-level="4"],.reel[data-level="5"],.reel[data-level="6"],.reel[data-level="7"]{
  box-shadow:inset 0 0 25px #b68a6738,0 0 14px #d5aa6480;background:radial-gradient(ellipse at center,#65485d,transparent 82%),#241725}
.reel[data-level="7"]{--reel-gold:#fff2ff;--reel-light:#e7abff}
.reel-head,.reel-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--reel-gold);font:700 13px/1.4 var(--interface)}
#stepCombo{white-space:nowrap;font-family:var(--display);letter-spacing:.12em}
#reelNumber{display:block;min-height:57px;font:700 clamp(29px,4.6vw,58px)/1.1 var(--display);font-variant-numeric:tabular-nums;text-align:center;
  color:var(--reel-gold);text-shadow:0 0 20px var(--reel-light);overflow-wrap:anywhere;padding:4px}
#reelNumber.count-pop{animation:count-pop .32s both}
@keyframes count-pop{0%{transform:scale(.94);opacity:.55}32%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}
.reel-foot{display:grid;grid-template-columns:minmax(0,1fr) auto}
#stepProgress{height:3px;max-width:100%;background:var(--reel-light);box-shadow:0 0 8px var(--reel-light);transition:width .12s}
.reel-foot button{font-size:11px;padding:5px 8px}
.chapter,.title{position:relative;border-color:#9a805b;box-shadow:inset 0 0 0 4px #211b2480,0 4px 0 #5b4940,0 8px 0 #2b242b,0 12px 22px #0005}
.chapter::after,.title::after{content:"";position:absolute;inset:9px;border:1px solid #ceac5e36;pointer-events:none}
.turn-page{animation:turn-page .43s both;transform-origin:12% 50%}
.turn-page::after{content:"";position:absolute;inset:12px 2% 9px;pointer-events:none;background:linear-gradient(95deg,transparent,#e4bd883a,transparent);animation:page-light .43s both}
.turn-fast,.turn-fast::after{animation-duration:.18s}
@keyframes turn-page{0%{transform:rotateY(-18deg) translateX(-10px);filter:brightness(.72);opacity:.4}53%{filter:brightness(1.11)}100%{transform:none;opacity:1}}
@keyframes page-light{0%{opacity:.8;transform:scaleX(.58) translateX(-9%)}100%{opacity:0;transform:scaleX(1)}}
@media(max-width:1000px){.enemy{grid-template-columns:minmax(0,1.1fr) minmax(160px,1fr)}.combatant canvas{height:107px}}
@media(max-width:850px){.battle{grid-template-columns:1fr}.battle .column::after{display:none}}
@media(max-width:510px){.enemy{grid-template-columns:1fr;gap:8px}.enemy-info h1{display:none}.enemy-title{display:none}.enemy .intent{margin-top:5px}.combatant canvas{height:84px}.card{padding:4px 3px;min-height:83px;grid-template-rows:19px 36px 18px}.card .mana{width:15px;height:15px;top:4px;right:4px;font-size:10px}.card .card-rank{font-size:7px;padding-left:0;letter-spacing:0}.card .card-number{font-size:17px}.card .card-type{font-size:9px}.card .sigil{font-size:44px}.preview div{padding:5px 3px}.preview div:last-child strong{font-size:19px}.reel-head{font-size:11px}}
.card::after{content:"";position:absolute;inset:5px;z-index:-1;pointer-events:none;opacity:.55;
  background:linear-gradient(var(--tone),var(--tone)) left top/13px 1px,
    linear-gradient(var(--tone),var(--tone)) left top/1px 13px,
    linear-gradient(var(--tone),var(--tone)) right bottom/13px 1px,
    linear-gradient(var(--tone),var(--tone)) right bottom/1px 13px;background-repeat:no-repeat}
.slot.empty{background:#231e27;border-color:#a48a624e}
.turn-page::after{inset:15px 4% 14px 8%;transform-origin:left center;border-radius:0 9px 20px 0;
  background:linear-gradient(90deg,#423145,#846653 26%,#dfba85 65%,#ffe8b8 96%,#a7774a);
  box-shadow:12px 2px 30px #100e17a8;backface-visibility:visible}
@keyframes page-light{0%{opacity:.64;transform:rotateY(0deg) scaleX(.97)}
  43%{opacity:.5;transform:rotateY(-67deg) skewY(2deg)}
  74%,100%{opacity:0;transform:rotateY(-102deg) scaleX(.45)}}

.workshop{--metal:#eab77c;--aura:#a25d40;display:grid;grid-template-columns:minmax(115px,1fr) minmax(0,2.5fr);gap:22px;align-items:center;
  padding:20px;margin:17px 0;border:1px solid color-mix(in srgb,var(--metal),transparent 56%);background:radial-gradient(ellipse at 15% 51%,color-mix(in srgb,var(--aura),transparent 27%),transparent 55%),#201a25}
.workshop-shop{--metal:#f3d184;--aura:#7e6535}
.workshop-fuse{--metal:#d3c2ff;--aura:#624b95}
.workshop-sigil{width:min(100%,145px);aspect-ratio:1;position:relative;display:grid;place-items:center;margin:auto;border:1px solid var(--metal);border-radius:50%;color:var(--metal)}
.workshop-sigil i{position:absolute;inset:8%;border:1px dashed var(--metal);border-radius:50%;opacity:.66}
.workshop-sigil span{font:54px Georgia;text-shadow:0 0 25px var(--metal)}
.workshop-content .choices{margin:10px 0}
.workshop-transform{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin-bottom:14px}
.workshop-sources{display:flex;gap:6px;color:var(--metal);font:700 23px var(--display)}
.workshop-sources span{padding:3px 8px;border:1px solid color-mix(in srgb,var(--metal),transparent 60%)}
.result-card{min-width:130px;width:min(174px,100%);border-radius:2px}
.workshop-reveal[data-motion="full"] .result-card{animation:workshop-reveal .7s both}
.workshop-reveal[data-motion="fast"] .result-card{animation:workshop-reveal .24s both}
.workshop-reveal:not([data-motion="off"]) .workshop-sigil i{animation:workshop-circle .75s ease-out}
.workshop-shop.workshop-reveal:not([data-motion="off"]) .workshop-sources{animation:workshop-coin .6s both}
.workshop-fuse.workshop-reveal:not([data-motion="off"]) .workshop-sources span{animation:workshop-fuse .6s both}
.workshop-forge.workshop-reveal:not([data-motion="off"]) .workshop-sigil span{animation:workshop-hammer .62s both}

/* Bounded arena effects stay behind the combat readouts. */
.enemy {
  --hero-x: 24%;
  --foe-x: 76%;
  --burst-color: #ffd91b;
  --flight: 155ms;
  --impact: 640ms;
}
.enemy:is([data-rank="elite"],[data-rank="boss"],[data-rank="extra"]) {
  --hero-x: 18%;
  --foe-x: 68%;
}
.enemy[data-force="ward"] { --burst-color: #a6e1fc; }
.enemy[data-force="break"] { --burst-color: #ffae70; }
.enemy[data-force="great"] { --burst-color: #f3b3ff; }
.enemy[data-force="infinity"] { --burst-color: #b2fae9; }

.burst-scene {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.burst-scene i {
  position: absolute;
  display: block;
  opacity: 0;
  top: 39%;
  transform: translate(-50%, -50%);
}
.burst-seal {
  left: var(--hero-x);
  width: clamp(30px, 6vw, 85px);
  aspect-ratio: 1;
  border: 2px dotted #a6e8c9;
  border-radius: 50%;
  box-shadow: inset 0 0 13px #98dabb80, 0 0 10px #98dabb65;
}
.charging .burst-seal { animation: charge-seal 1.1s ease-out both; }
.burst-bolt {
  left: var(--hero-x);
  width: clamp(26px, 7vw, 94px);
  height: 9px;
  border-radius: 60%;
  background: linear-gradient(90deg,transparent,var(--burst-color) 70%,#fff9e6);
  box-shadow: 0 0 12px var(--burst-color);
}
.burst-firing .burst-bolt { animation: bolt-flight var(--flight) ease-in both; }
.burst-ring {
  left: var(--foe-x);
  width: clamp(32px, 8vw, 112px);
  aspect-ratio: 1;
  border: 2px solid var(--burst-color);
  border-radius: 50%;
  box-shadow: 0 0 11px var(--burst-color);
}
.player-strike:not(.player-miss) .burst-ring:not(.echo) {
  animation: impact-ring var(--impact) ease-out both;
}
.player-strike:is([data-force="great"],[data-force="infinity"],[data-force="break"]) .burst-ring.echo {
  border-style: dashed;
  animation: impact-ring var(--impact) 80ms ease-out both;
}
.player-landed[data-force="break"] .burst-ring {
  border-radius: 18%;
}
.player-blocked .burst-ring:not(.echo) {
  background: radial-gradient(ellipse,transparent 60%,#a4d9fe44);
  animation-name: barrier-ripple;
}
.player-miss .slash,
.player-miss .combatant canvas { animation: none; }
.player-miss #outgoing { color: #dbcfbd; text-shadow: 0 2px 5px #140f18; }
.encounter-arrival .foe canvas { animation: enemy-arrive .42s ease-out both; }
.encounter-arrival:is([data-rank="boss"],[data-rank="extra"]) .foe canvas {
  animation: boss-arrive .64s cubic-bezier(.18,.65,.2,1) both;
}
.encounter-arrival:is([data-rank="boss"],[data-rank="extra"]) .burst-ring:not(.echo) {
  border-style: double;
  animation: impact-ring .66s ease-out both;
}
@keyframes charge-seal {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.52) rotate(-30deg); }
  45% { opacity: .9; }
  100% { opacity: .52; transform: translate(-50%, -50%) scale(1.16) rotate(15deg); }
}
@keyframes bolt-flight {
  0% { opacity: .2; left: var(--hero-x); transform: translate(-70%, -50%) scaleX(.45); }
  34% { opacity: 1; }
  100% { opacity: .9; left: var(--foe-x); transform: translate(-80%, -50%) scaleX(1.15); }
}
@keyframes impact-ring {
  0% { opacity: .85; transform: translate(-50%, -50%) scale(.28) rotate(-12deg); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.85) rotate(18deg); }
}
@keyframes barrier-ripple {
  0% { opacity: 0; transform: translate(-50%, -50%) scaleX(.7); }
  20% { opacity: .9; transform: translate(-50%, -50%) scale(1.08); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.27); }
}
@keyframes enemy-arrive {
  from { opacity: 0; transform: translateX(18px); }
  to { opacity: 1; transform: none; }
}
@keyframes boss-arrive {
  0% { opacity: .05; transform: translateY(-18px) scale(.83); }
  59% { opacity: 1; transform: translateY(4px) scale(1.045); }
  100% { opacity: 1; transform: none; }
}
#app[data-motion="fast"] .enemy { --flight: 65ms; --impact: 150ms; }
#app[data-motion="fast"] .enemy :is(canvas,.slash,.enemy-cast,#incoming,#outgoing) {
  animation-duration: .15s;
  animation-iteration-count: 1;
}
#app[data-motion="fast"] .enemy.charging canvas,
#app[data-motion="fast"] .charging .burst-seal,
#app[data-motion="fast"] .burst-ring.echo { animation: none; }
#app[data-motion="fast"] .dealing .card {
  animation-duration: .16s;
  animation-delay: calc(var(--deal)*10ms);
}
#app[data-motion="fast"] .reel #reelNumber { animation-duration: .09s; }
#app[data-motion="off"] :is(.enemy,.hand,.reel,.workshop,.relic-drop),
#app[data-motion="off"] :is(.enemy,.hand,.reel,.workshop,.relic-drop) * {
  animation: none;
  transition: none;
}
@media (prefers-reduced-motion: reduce) {
  #app .burst-scene,
  #effect.flash { display: none; }
}

.enemy-defeated.player-landed .foe canvas {
  animation: enemy-defeated .64s ease-out both;
}
@keyframes enemy-defeated {
  0% { opacity: 1; }
  23% { opacity: 1; transform: translateX(8px) scale(1.08); filter: brightness(1.85); }
  100% { opacity: 0; transform: translate(14px, 5px) scale(.88); }
}

#app[data-motion="off"] .rune.relic-firing { animation: none; }

.board-card .returnable-label { color: #e9ceff; font-weight: 700; }
.removal-scene {
  position: relative;
  display: grid;
  justify-items: center;
  width: min(170px,100%);
  margin-block: 6px 16px;
  isolation: isolate;

.removed-card { width: min(130px,100%); }
.removal-ring,.removal-cut { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
.removal-ring {
  inset: 8% 12%;
  border: 2px solid #ef9eac;
  border-radius: 50%;
  box-shadow: inset 0 0 14px #e791a94d;
  z-index: -1;
}
.removal-cut {

  background: linear-gradient(90deg,transparent,#ec9aae,#fff3e0,#ec9aae,transparent);

.workshop-remove[data-motion="full"] .removal-scene { --erase-time: 710ms; }
.workshop-remove[data-motion="fast"] .removal-scene { --erase-time: 260ms; }
.workshop-remove:not([data-motion="off"]) .removed-card { animation: erase-card var(--erase-time) ease-in both; }
.workshop-remove:not([data-motion="off"]) .removal-ring { animation: erase-ring var(--erase-time) ease-out both; }
.workshop-remove:not([data-motion="off"]) .removal-cut { animation: erase-cut var(--erase-time) ease-out both; }
@keyframes erase-card {
  0%,24% { opacity: 1; transform: none; clip-path: inset(0); }
  47% { opacity: 1; transform: rotate(-8deg) scale(1.06); clip-path: inset(0); }
  100% { opacity: 0; transform: rotate(-15deg) scale(.68); clip-path: inset(50% 0); }
}
@keyframes erase-ring {
  0% { opacity: .1; transform: scale(.55) rotate(-10deg); }
  42% { opacity: .95; }
  100% { opacity: 0; transform: scale(1.3) rotate(15deg); }

  if (s.length<=4) return s;
  if (scientific || s.length>72) return s[0]+'.'+s.slice(1,5)+'e+'+(s.length-1);
  const groups=[];
  for(let end=s.length,i=0;end>0;end-=4,i++) {
    const part=Number(s.slice(Math.max(0,end-4),end));
    if(part) groups.unshift(part+units[i]);

}

function drawRelic(rng,owned,act,{shop=false}={}) {
  const available=Object.keys(relics).filter(id=>!owned.includes(id));
  const eligible=available.filter(id=>(act>=2||!['comet','crown'].includes(id))&&(!shop||relics[id].rank<3||act>=3));

  const original=eligible.filter(id=>originalRelics.has(id));

  if(!pool.length) return null;
  const weighted=pool.map(id=>{
    const rank=relicRanks[relics[id].rank];

  });
  let pick=rng()*weighted.reduce((total,entry)=>total+entry.weight,0);
  return weighted.find(entry=>(pick-=entry.weight)<0).id;
}

const effectOrder=['grimoire','tail','order','short','chain','star','sum','abacus','lattice','mosaic','ratio',
  ...Object.keys(relics).slice(20).filter(id=>relics[id].effect)];

function cleanseDebuffs(deb,boardLength,count) {
  const first=deb.map((_,index)=>index).sort((a,b)=>Math.min(deb[a].at,boardLength)-Math.min(deb[b].at,boardLength));
  const cleared=new Set(first.slice(0,count));
  return deb.filter((_,index)=>!cleared.has(index));
}
function evaluate({base=20,board=[],deb=[] ,owned=[],armor=1,holds=0}) {
  const cards=[];
  for(let i=0;i<=board.length;i++) {
    cards.push(...deb.filter(c=>Math.min(c.at,board.length)===i));
    if(i<board.length) cards.push(board[i]);
  }
  let result=[BigInt(base),1n], sealed=false;
  const locks=new Set(deb.filter(c=>c.kind==='lock').map(c=>c.target));
  const steps=[];
  const factors=[];
  for(const c of cards) {
    let op=c;
    if(c.enemy && c.kind==='div') {
      if(owned.includes('prism')) op={...c,kind:'mul'};
      else if(owned.includes('key')) op=null;
    }
    if(c.kind==='seal') sealed=true;
    else if(sealed && !c.enemy) {
      sealed=false;
      op=null;
    }
    if(!c.enemy&&locks.has(c.kind)) op=null;
    if(op) result=apply(result,op);
    if(op && ['mul','pow','exp'].includes(op.kind)) factors.push(op);
    steps.push({card:c,op,result});
  }
  const normal=result, triggers=[];
  const activeCards=steps.map(({card,op})=>op?card:{kind:'sealed',enemy:true});
  const own=steps.filter(({card,op})=>op&&!card.enemy).map(({card})=>card);
  const count=own.length;
  for(const id of effectOrder) {
    if(!owned.includes(id)) continue;
    const op=relics[id].effect({cards:activeCards,count,combo:count,own,holds});
    if(!op) continue;
    result=apply(result,op);
    factors.push(op);
    triggers.push({id,op,result});
  }
  return {normal,result,final:damage(apply(result,{kind:'div',value:armor})),steps,triggers,factors};
}

function random(seed, checkpoint) {

    state=(state+0x6D2B79F5)|0;

  const a=[...items];
  for(let i=a.length-1;i>0;i--) {

function rollTier(rng,act,boost) {
  const roll=rng()*100+boost+8*(act-1);

}
function generate(rng,act,boost=0) {
  const tier=rollTier(rng,act,boost);
  const kinds=act>=2&&tier>=2?['add','mul','pct','pow','exp']:['add','mul','pct'];
  const kind=kinds[Math.floor(rng()*kinds.length)];
  const [lo,hi]=ranges[kind][tier];
  const anchors=[10,15,20,25,50,75,100,101,120,125,150,175,200,250,500,1000,1250]
    .filter(n=>n>=lo&&n<=hi);
  const value=rng()<0.35&&anchors.length?anchors[Math.floor(rng()*anchors.length)]:lo+Math.floor(rng()*(hi-lo+1));
  return card(kind,value,tier);
}

    ...[2,2,3,3].map(v=>card('mul',v)),

    card('clean',0),card('ward',0)

}

  if(!c||c.upgraded) return null;
  if(supportKinds.includes(c.kind)) {
    if(mode==='adjust'&&c.cost>1) return {...c,cost:c.cost-1,upgraded:true};
    const value=Math.min(supportCaps[c.kind],supportValue(c)+(c.kind==='guard'?6:1));
    return mode==='power'&&value>supportValue(c)?{...c,value,upgraded:true}:null;
  }
  if(!['add','mul','pct'].includes(c.kind)) return null;
  const adjust=c.value+Math.max(1,Math.floor(c.value/5));
  let value=mode==='power'?c.value*2:adjust;
  if(mode==='digit') {
    if(!Number.isInteger(digit)||digit<0||digit>9) return null;
    const delta=(digit-c.value%10+10)%10;
    if(delta===0) return null;
    value=c.value+delta;
  }
  return {...c,value,upgraded:true};
}
function fused(a,b) {
  if(!a||!b||a.kind!==b.kind) return null;
  if(supportKinds.includes(a.kind)) {
    const value=Math.min(supportCaps[a.kind],supportValue(a)+supportValue(b));
    if(value<=Math.max(supportValue(a),supportValue(b))) return null;
    return {...card(a.kind,value,Math.max(a.tier,b.tier)),cost:Math.max(a.cost,b.cost)};
  }
  if(!['add','mul','pct'].includes(a.kind)) return null;
  const value=a.kind==='mul'?a.value*b.value:a.value+b.value;
  if(!Number.isSafeInteger(value)||value>99999) return null;
  return {...card(a.kind,value,Math.max(a.tier,b.tier)),cost:Math.min(3,Math.max(a.cost,b.cost)+1)};
}

function paintEvent(canvas,id) {
  const scene=eventScenes[id];
  if(!scene) return false;
  const [night,mid,light,glow,interior,compose]=scene;
  const ctx=canvas.getContext('2d');
  const [width,height]=eventCanvasSize;
  const rng=random('event-art/'+id);
  const ink='#141723';
  const rect=(x,y,w,h,color)=>{
    ctx.fillStyle=color.startsWith('#')?color:'#'+color;
    ctx.fillRect(Math.round(x),Math.round(y),w,h);
  };
  const polygon=(points,color)=>{
    // Scan-convert at the canvas pixel grid for hard, unfiltered edges.
    const ys=points.map(([,y])=>y);
    for(let y=Math.floor(Math.min(...ys));y<Math.ceil(Math.max(...ys));y++) {
      const xs=[];
      const scan=y+.5;
      for(let i=0;i<points.length;i++) {
        const [x0,y0]=points[i], [x1,y1]=points[(i+1)%points.length];
        if((y0<=scan&&scan<y1)||(y1<=scan&&scan<y0)) xs.push(x0+(x1-x0)*(scan-y0)/(y1-y0));
      }
      xs.sort((a,b)=>a-b);
      for(let i=0;i+1<xs.length;i+=2) rect(Math.ceil(xs[i]),y,Math.max(0,Math.ceil(xs[i+1])-Math.ceil(xs[i])),1,color);
    }
  };
  const disc=(x,y,r,color)=>{
    for(let dy=-r;dy<=r;dy++) {
      const dx=Math.floor(Math.sqrt(r*r-dy*dy));
      rect(x-dx,y+dy,2*dx+1,1,color);
    }
  };
  const diamond=(x,y,r,color)=>polygon([[x,y-r],[x+r,y],[x,y+r],[x-r,y]],color);
  const line=(x,y,xx,yy,color,weight=1)=>{
    const n=Math.max(1,Math.abs(xx-x),Math.abs(yy-y));
    for(let i=0;i<=n;i++) rect(x+(xx-x)*i/n,y+(yy-y)*i/n,weight,weight,color);
  };

  const arch=(x,y,w,h)=>{
    const l=x-w/2,r=x+w/2,t=y-h;
    const outline=[[l,y],[l,t+13],[l+7,t+5],[x-9,t],[x+9,t],[r-7,t+5],[r,t+13],[r,y]];
    polygon(outline,light);
    polygon([[l+3,y],[l+3,t+14],[l+10,t+6],[x-8,t+3],[x+8,t+3],[r-10,t+6],[r-3,t+14],[r-3,y]],night);
    for(let n=t+18;n<y;n+=7) {rect(l,n,3,1,ink);rect(r-3,n,3,1,ink);}
  };
  const star=(x,y,r)=>{diamond(x,y,r,light);line(x-r,y,x+r,y,glow);line(x,y-r,x,y+r,glow);rect(x-1,y-1,3,3,glow);};
  const flame=(x,y,h)=>{
    polygon([[x-5,y],[x-8,y-5],[x-1,y-h],[x+1,y-h*.57],[x+5,y-h*.75],[x+8,y-4],[x+5,y]],light);
    polygon([[x-3,y],[x-3,y-4],[x+1,y-h*.55],[x+4,y-3],[x+2,y]],glow);
  };
  const pillar=(x,y,h)=>{rect(x-5,y-h,10,h,mid);rect(x-5,y-h,2,h,light);rect(x-8,y-h,16,3,light);rect(x-9,y-3,18,3,ink);};
  const wheel=(x,y,r)=>{
    disc(x,y,r,light);disc(x,y,r-3,night);
    for(let i=0;i<8;i++) {
      const angle=i*Math.PI/4,dx=Math.round(Math.cos(angle)*(r-1)),dy=Math.round(Math.sin(angle)*(r-1));
      line(x,y,x+dx,y+dy,light,2);

    }
    disc(x,y,3,glow);
  };
  const tree=(x,y,h)=>{
    line(x,y,x-2,y-h+11,ink,4);

    for(const [dx,dy,r] of [[-10,16,10],[0,9,12],[13,16,9],[-4,23,13]]) {
      const v=y-h+dy;
      disc(x+dx,v,r,mid);
      disc(x+dx-1,v-4,r-4,light);
    }
  };
  rect(0,0,width,height,night);

  for(let i=0;i<58;i++) {

    for(let i=0;i<24;i++) rect(rng()*width,70+rng()*17,2+Math.floor(rng()*9),1,mid);
  }
  const art={
    arch,star,flame,pillar,wheel,tree,
    table:(x,y,w)=>{rect(x-w/2,y-6,w,5,light);rect(x-w/2+4,y-1,4,10,ink);rect(x+w/2-8,y-1,4,10,ink);},
    scroll:(x,y)=>{polygon([[x-16,y+5],[x-13,y-8],[x+14,y-10],[x+17,y+3]],glow);line(x-10,y-3,x+9,y-5,mid);line(x-10,y,x+7,y-2,mid);diamond(x+10,y+1,3,light);},

    altar:(x,y)=>{rect(x-21,y-5,42,5,light);rect(x-14,y,28,5,mid);rect(x-25,y+5,50,3,light);},
    chest:(x,y)=>{rect(x-15,y-12,30,15,mid);rect(x-12,y-15,24,4,light);rect(x-15,y-8,30,2,glow);rect(x-2,y-9,4,5,glow);},
    gem:(x,y,r)=>{diamond(x,y,r,light);polygon([[x,y-r],[x+r,y],[x,y+2],[x-r,y]],glow);line(x,y-r+2,x,y+r-2,mid);},
    shelves:(x,y,w)=>{rect(x,y-40,w,40,ink);for(let dy=-33;dy<=0;dy+=11){rect(x,y+dy,w,2,light);for(let dx=3;dx<w-2;dx+=5)rect(x+dx,y+dy-6,3,6,(dx+dy)%3?mid:glow);}},
    water:(x,y,w)=>{rect(x-w/2,y-10,w,20,mid);for(let i=0;i<25;i++)rect(x-w/2+rng()*(w-13),y-9+rng()*19,3+Math.floor(rng()*11),1,i%6?light:glow);},

function makeMap(seed,act) {
  const rng=random(seed+'/map/'+act);
  const facilities=['event','rest','shop'];
  const types=[['fight','fight','fight'],facilities,['fight','elite','fight'],
    ['fight','rest','shop'],['fight','elite','elite'],facilities,
    ['fight','fight','elite'],['event','shop','rest'],['fight','elite','fight'],['boss']];
  const rows=types.map((kinds,row)=>shuffle(kinds,rng).map((kind,i)=>({
    id:row+'-'+i, row, col:kind==='boss'?1:i, kind,
    variant:Math.floor(rng()*(kind==='boss'?2:kind==='fight'?6:3)),next:[]
  })));
  rows.forEach((nodes,row)=>nodes.forEach(node=>{
    const next=rows[row+1]||[];
    const neighbors=next.filter(n=>Math.abs(n.col-node.col)<=1);
    node.next=neighbors.filter((n,i)=>n.col===node.col||next.length===1||row===0||
      (node.col===1&&i===row%2*2)||rng()<.66).map(n=>n.id);
  }));
  return rows;
}

function encounterName(act,kind,variant) {
  if(act===4&&kind==='extra') return extraEnemyName;
  const specs={fight:normalSpecs,elite:eliteSpecs,boss:bossSpecs};
  return specs[kind]?.[act-1]?.[variant]?.[0];

function makeEnemy(act,kind,variant,row,bench=0n) {
  if(act===4) return {name:extraEnemyName,title:'EXTRA',detail:'耐久段階を越えて無限を破る。',art:{form:'eclipse',palette:17},kind:'extra',
    hp:10n**31n,max:10n**31n,attack:21,armor:5,barrier:0,gates:[5n*10n**30n],cycle:['div','attack','drain','double']};
  const a=act-1, elite=kind==='elite', boss=kind==='boss';
  const spec=elite?eliteSpecs[a][variant]:boss?bossSpecs[a][variant]:null;
  const [normalName,normalForm,...normalMoves]=normalSpecs[a][variant%6];
  const [name,,detail,...moves]=spec||[normalName,0,'',...normalMoves,'attack'];
  const form=boss?bossForms[a][variant]:elite?monsterForms[a][variant]:normalForm;
  const art={form,palette:a*6+variant};
  const trait=moves.at(-1);
  if(trait.startsWith('barrier')||trait.startsWith('gate')) moves.pop();
  const balance=boss&&act===3?finalBossBalance[variant]:null;
  const floor=elite?eliteFloors[a]*BigInt(Math.max(1,row-1)):boss?(balance?.floor??bossFloors[a]):normalFloors[a]*BigInt(1+row*2);
  const target=bench/(balance?.scaleDivisor??(boss?2n:elite?4n:7n));
  const max=target>floor?(target>floor*400n?floor*400n:target):floor;
  const gates=trait==='gate2'?[max/2n]:trait==='gate3'?[max*2n/3n,max/3n]:[];
  return {name,art,detail,kind,elite,title:boss?'ACT BOSS':elite?'DEFLATION ENEMY':'ENCOUNTER',
    hp:max,max,armor:balance?.armor??(1+a),attack:boss?(balance?.attack??bossAttack[a]):5+a*3+(elite?3:0),barrier:trait==='barrier2'?2:trait==='barrier'?1:0,gates,cycle:moves};
}

};
const attackHits=move=>attackPatterns[move.kind]?.hits??0;
function intent(enemy,turn,act) {
  const [kind,target]=enemy.cycle[turn%enemy.cycle.length].split(':');
  const values={attack:enemy.attack,double:Math.ceil(enemy.attack*.65),wither:8+act*2,drain:50,
    div:[2,4,8,10][act-1],pct:-20-act*5,sub:20*act,
    cleave:enemy.attack,wave:enemy.attack,meteor:enemy.attack,eclipse:enemy.attack,
    dust:Math.floor(enemy.attack*.67),flare:Math.floor(enemy.attack*.88),pursuit:Math.round(enemy.attack*.42)};
  return {kind,...(target?{target}:{}),value:values[kind]??0,at:1+turn%2,enemy:true};
}
function impact(enemy,damage) {
  if(damage<=0n) return {dealt:0n,kind:'miss'};
  if(enemy.barrier) return {dealt:0n,kind:'barrier'};
  const gate=enemy.gates[0];
  if(gate!==undefined&&enemy.hp-damage<=gate) return {dealt:enemy.hp-gate,kind:'gate'};
  return {dealt:damage>enemy.hp?enemy.hp:damage,kind:'hit'};
}

const earlyRelicChoices=['sum','abacus','lattice','ratio','order','tail'];
const prices={buy:30,relic:96,fuse:24,remove:30};
class Run {
  uncommittedCards=new Set();
  constructor(seed) {
    this.seed=seed;
    this.rng=random(seed);
    this.stage=0;
    this.hp=100;
    this.gold=20;
    this.deck=starter();
    this.owned=[];
    this.history=[];
    this.stats={max:0n,combo:0,mul:0,pow:0,exp:0,infinity:0,turns:0,formula:'',usage:{},bosses:0,intercepts:0,prevented:0};
    this.act=1;
    this.recent=[];
    this.beginMap();
  }
  bonus(key){return this.owned.reduce((n,id)=>n+(relics[id][key]||0),0);}
  get base(){return this.baseAt(this.drain);}
  baseAt(drain=0){return Math.max(1,Math.floor((20+(this.act-1)*15)*(100+this.bonus('base')-drain)/100)+this.bonus('flatBase'));}
  get slots(){return Math.min(8,5+this.act)+this.bonus('slots');}
  get capacity(){return Math.max(1,(this.act>=3?4:3)+this.bonus('energy')-(this.energyPenalty??0)+(this.turn===0?this.bonus('firstEnergy'):0));}
  get drawCount(){return Math.max(2,5+this.bonus('draw')-(this.drawPenalty??0)+(this.turn===0?this.bonus('firstDraw'):0));}
  get wardCharges(){return Number(this.ward)||0;}
  get guardPoints(){return this.guard??0;}
  get next(){return intent(this.enemy,this.turn,this.act);}
  beginMap(){
    this.phase='map';
    this.map=makeMap(this.seed,this.act);
    this.node=null;
    this.visited=[];
    this.routes=this.map[0].map(node=>node.id);
  }
  start(node) {
    const samples=[...this.recent].sort((a,b)=>a<b?-1:a>b?1:0);
    const bench=samples[Math.floor((samples.length-1)/2)]??0n;
    this.phase='battle';
    this.relicDrop=null;
    this.relicAlternative=null;
    this.relicDecision=null;
    this.enemy=makeEnemy(this.act,node?.kind,node?.variant,node?.row,bench);
    this.hp=Math.max(1,this.hp-this.bonus('entry'));
    this.maxHp=100;
    this.drain=0;
    this.drawPenalty=0;
    this.energyPenalty=0;
    this.battlePeak=0n;
    this.lastBurst=null;
    this.deckDraw=shuffle(this.deck,this.rng);
    this.discard=[];
    this.hand=[];
    this.board=[];
    this.uncommittedCards.clear();
    this.deb=[];
    this.turn=0;
    this.holds=0;
    this.ward=this.bonus('ward')>0;
    this.guard=0;
    this.interceptUsed=false;
    this.refill();
  }
  refill() {
    this.discard.push(...this.hand);
    this.hand=[];
    this.energy=this.capacity;
    while(this.hand.length<this.drawCount) {
      if(!this.deckDraw.length) {
        this.deckDraw=shuffle(this.discard,this.rng);
        this.discard=[];
      }
      if(!this.deckDraw.length) break;
      this.hand.push(this.deckDraw.pop());
    }
  }
  canPlay(c) {
    if(this.phase!=='battle'||!c||c.cost>this.energy) return false;
    if(c.kind==='clean') return this.deb.length>0;
    if(c.kind==='ward') return this.wardCharges<supportCaps.ward;
    if(c.kind==='guard') return this.guardPoints<supportCaps.guard;
    return this.board.length<this.slots;
  }
  play(i,at=this.board.length) {
    const c=this.hand[i];
    if(!this.canPlay(c)) return false;
    this.energy-=c.cost;
    this.hand.splice(i,1);
    this.stats.usage[c.kind]=(this.stats.usage[c.kind]||0)+1;
    if(supportKinds.includes(c.kind)) {
      const power=supportValue(c);
      if(c.kind==='ward') this.ward=Math.min(supportCaps.ward,this.wardCharges+power);
      else if(c.kind==='guard') this.guard=Math.min(supportCaps.guard,this.guardPoints+power);
      else this.deb=cleanseDebuffs(this.deb,this.board.length,power);
      this.discard.push(c);
    } else {
      this.board.splice(at,0,c);
      this.uncommittedCards.add(c);
    }
    return true;
  }
  canReturn(i) {
    return this.phase==='battle'&&this.uncommittedCards.has(this.board[i]);
  }
  returnToHand(i) {
    if(!this.canReturn(i)) return false;
    const [card]=this.board.splice(i,1);
    this.uncommittedCards.delete(card);
    this.hand.push(card);
    this.energy+=card.cost;
    if(--this.stats.usage[card.kind]===0) delete this.stats.usage[card.kind];
    return true;
  }
  move(from,to) {
    if(!this.board[from]||to<0||to>=this.board.length) return false;
    this.board.splice(to,0,this.board.splice(from,1)[0]);
    return true;
  }
  preview(){
    const result=evaluate({base:this.base,board:this.board,deb:this.deb,owned:this.owned,armor:this.enemy.armor,holds:this.holds});
    return {...result,impact:impact(this.enemy,result.final)};
  }
  interceptReason(p=this.preview()) {
    if(this.interceptUsed) return 'この戦闘では使用済み';
    if(this.energy<1) return 'エネルギーを1残す';
    if(!attackHits(this.next)) return '敵の攻撃予告が必要';
    if(p.impact.dealt===this.enemy.hp) return '通常BURSTで撃破できる';
    if(!p.impact.dealt) return '敵HPにダメージが通る盤が必要';
    if(p.steps.filter(step=>!step.card.enemy&&step.op).length<2) return '有効な演算が2枚以上必要';
    if(this.enemyOutcome().hp===this.enemyOutcome(this.next,true).hp) return '防御だけで攻撃をしのげる';
    return '';
  }
  enemyOutcome(action=this.next,intercept=false) {
    let {hp,maxHp,drain,ward,deb}=this;
    let blocked=false,drawPenalty=0,energyPenalty=0;
    const hits=attackHits(action);
    const penalty=attackPatterns[action.kind]?.penalty;
    const intercepted=intercept&&hits>0?action.value:0;
    const attackDamage=action.value*hits-intercepted;
    const absorbed=Math.min(this.guardPoints,attackDamage);
    const guard=attackDamage>0?0:this.guardPoints;
    hp=Math.max(0,hp-attackDamage+absorbed);
    if(!hits||penalty) {
      if(ward) {ward=Number(ward)-1||false;blocked=true;}
      else if(penalty==='jam') drawPenalty=1;
      else if(penalty==='tax') energyPenalty=1;
      else if(penalty==='fracture') deb=[...deb,{...action,kind:'seal'}];
      else if(penalty==='scorch') deb=[...deb,{...action,kind:'sub',value:20*this.act}];
      else if(action.kind==='wither') {
        maxHp=Math.max(35,maxHp-action.value);
        hp=Math.min(hp,maxHp);
      } else if(action.kind==='drain') drain=Math.min(65,drain+action.value);
      else deb=[...deb,action];
    }
    return {hp,maxHp,drain,ward,guard,deb,blocked,absorbed,intercepted,drawPenalty,energyPenalty};
  }
  holdPreview(outcome=this.enemyOutcome()) {
    if(this.holds>=2||!outcome.hp||!this.board.length) return null;
    const result=evaluate({base:this.baseAt(outcome.drain),board:this.board,deb:outcome.deb,owned:this.owned,armor:this.enemy.armor,holds:this.holds+1});
    return result.final;
  }
  enemyAction(intercept=false) {
    this.uncommittedCards.clear();
    const {hp,maxHp,drain,ward,guard,deb,drawPenalty,energyPenalty}=this.enemyOutcome(this.next,intercept);
    Object.assign(this,{hp,maxHp,drain,ward,guard,deb,drawPenalty,energyPenalty});
    this.turn++;
    if(!this.hp) this.phase='loss';
    else this.refill();
  }
  hold() {
    if(this.phase!=='battle'||this.holds>=2) return false;
    this.holds++;
    this.stats.turns++;
    this.enemyAction();
    return true;
  }
  burst(intercept=false) {
    if(this.phase!=='battle') return null;
    const p=this.preview();
    if(intercept) {
      if(this.interceptReason(p)) return null;
      const before=this.enemyOutcome(),after=this.enemyOutcome(this.next,true);
      this.energy--;
      this.interceptUsed=true;
      this.stats.intercepts=(this.stats.intercepts??0)+1;
      this.stats.prevented=(this.stats.prevented??0)+after.hp-before.hp;
    }
    this.stats.turns++;
    const formula=[String(this.base),...p.steps.map(s=>s.op?label(s.op):'無効'),...p.triggers.map(t=>relics[t.id].name),
      ...(this.enemy.armor>1?['装甲 ÷'+this.enemy.armor]:[])].join(' → ');
    this.lastBurst={...p,formula};
    this.history.unshift(this.lastBurst);
    this.history.length=Math.min(this.history.length,50);
    const s=this.stats;
    if(p.final>s.max) {s.max=p.final;s.formula=formula;}
    for(const c of p.factors) s[c.kind]=Math.max(s[c.kind],c.value);
    s.combo=Math.max(s.combo,this.board.length);
    s.infinity+=Number(p.final>CAP);
    if(p.impact.kind==='barrier') this.enemy.barrier--;
    if(p.impact.kind==='gate') this.enemy.gates.shift();
    if(p.impact.dealt>0n&&p.final>this.battlePeak) this.battlePeak=p.final;
    this.enemy.hp-=p.impact.dealt;
    this.discard.push(...this.board);
    this.board=[];
    this.uncommittedCards.clear();
    this.deb=[];
    this.holds=0;
    if(!this.enemy.hp) {
      this.recent.push(this.battlePeak);
      if(this.recent.length>5) this.recent.shift();
      const boss=this.enemy.kind==='boss', elite=this.enemy.elite;
      if(boss) this.stats.bosses++;
      const hpBefore=this.hp;
      this.hp=Math.min(100,this.hp+(boss?28:elite?13:7));
      this.victoryHeal=this.hp-hpBefore;
      if(elite||boss||this.act===4) {
        this.relicDrop=drawRelic(this.rng,this.owned,this.act);
        if(this.relicDrop) {
          if(elite&&this.act<=2) {
            const alternatives=earlyRelicChoices.filter(id=>id!==this.relicDrop&&!this.owned.includes(id));
            const rewardRng=random(this.seed+'/relic/'+this.act+'/'+this.node.id);
            this.relicAlternative=alternatives[Math.floor(rewardRng()*alternatives.length)]??null;
          }
          this.relicDecision='pending';
        }
      }
      this.reward();
    } else this.enemyAction(intercept);

  }
  reward() {
    this.phase='reward';
    this.offers=this.act===4?[]:Array.from({length:3},()=>generate(this.rng,this.act,this.enemy.elite?17:5));
    if(this.offers.length) {
      const supportRng=random(this.seed+'/support/reward/'+this.stage);
      if(supportRng()<.34) this.offers[2]=generateSupport(supportRng,this.act,this.enemy.elite?17:5);
    }
    this.cardDecision={status:this.offers.length?'pending':'none'};
    this.goldReward=this.enemy.kind==='boss'?48:this.enemy.elite?40:24;
    this.goldDecision='pending';
  }
  get rewardPending(){
    return this.phase==='reward'&&(this.cardDecision.status==='pending'||this.goldDecision==='pending'||this.relicDecision==='pending');
  }
  takeCard(i) {
    if(this.phase!=='reward'||this.cardDecision.status!=='pending'||!this.offers[i]) return false;
    const card=this.offers[i];
    this.deck.push(card);
    this.cardDecision={status:'taken',card};
    return true;
  }
  skipCard() {
    if(this.phase!=='reward'||this.cardDecision.status!=='pending') return false;
    this.cardDecision={status:'skipped'};
    return true;
  }
  chooseGold(take) {
    if(this.phase!=='reward'||this.goldDecision!=='pending') return false;
    if(take) this.gold+=this.goldReward;
    this.goldDecision=take?'taken':'skipped';
    return true;
  }
  chooseRelic(take,index=0) {
    if(this.phase!=='reward'||this.relicDecision!=='pending') return false;
    if(take) {
      const choice=[this.relicDrop,this.relicAlternative][index];
      if(!choice||this.owned.includes(choice)) return false;
      this.owned.push(choice);
      this.relicDrop=choice;
      this.relicAlternative=null;
    }
    this.relicDecision=take?'taken':'skipped';
    return true;
  }
  advance() {
    if(this.phase!=='reward'||this.rewardPending) return;
    if(this.act===4) {this.phase='win';return;}
    if(this.enemy.kind==='boss') {
      if(this.act===3) {this.phase='clear';return;}
      this.act++;
      this.beginMap();
    } else this.leaveNode();
  }
  extra(){
    if(this.phase!=='clear') return;

    this.start();
  }
  leaveNode(){
    this.phase='map';
    this.routes=this.node.next;
  }
  route(id) {
    if(this.phase!=='map'||!this.routes.includes(id)) return false;
    const node=this.map.flat().find(n=>n.id===id);
    this.node=node;
    this.visited.push(id);
    this.stage++;
    if(['fight','elite','boss'].includes(node.kind)) {this.start(node);return true;}
    this.phase='facility';
    this.facility=node.kind;
    if(node.kind==='shop') {
      this.shop=Array.from({length:4},()=>generate(this.rng,this.act,16));
      const supportRng=random(this.seed+'/support/shop/'+this.stage);
      this.shop[3]=generateSupport(supportRng,this.act,16);
      const first=drawRelic(this.rng,this.owned,this.act,{shop:true});
      const second=drawRelic(this.rng,[...this.owned,first],this.act,{shop:true});
      this.stockRelics=[first,second].filter(Boolean);
      this.shopUsed={relic:false,fuse:false,remove:false};
    }
    if(node.kind==='event') {
      const rng=random(this.seed+'/event-route');
      this.seenEvents??=[];
      const order=shuffle(Object.keys(events),rng);
      this.event=order.find(id=>!this.seenEvents.includes(id));
      if(!this.event) {
        this.seenEvents=[];
        this.event=order[0];
      }
      this.seenEvents.push(this.event);
    }
    return true;
  }
  get eventOffers(){
    const definition=events[this.event];
    if(!definition) return [];
    return [definition,...(definition.choices??[])].map((choice,index)=>{
      const hp=Math.min(100-this.hp,choice.hp||0);
      const gold=choice.gold||0;
      const key=this.seed+'/event/'+this.act+'/'+this.node.id;
      const rng=random(index?key+'/'+index:key);
      const result=choice.card?generate(rng,this.act,choice.card):
        choice.support?generateSupport(rng,this.act,choice.support,choice.kind):null;
      return {...choice,hp,gold,result,available:this.hp+hp>0&&this.gold+gold>=0};
    });
  }
  get eventOffer(){return this.eventOffers[0]??null;}
  service({action,i,j,mode,digit}={}) {
    if(this.phase!=='facility') return null;
    const facility=this.facility;
    if(facility==='event'&&['event','decline'].includes(action)) {
      if(action==='decline') {this.leaveNode();return {message:'イベントを見送った。'};}
      const offer=this.eventOffers[i??0];
      if(!offer?.available) return null;
      const {hp,gold,result}=offer;
      this.hp+=hp;
      this.gold+=gold;
      if(result) this.deck.push(result);
      this.leaveNode();
      return {kind:'event',event:this.event,hp,gold,result};
    }
    if(facility==='rest'&&action==='heal') {
      this.hp=Math.min(100,this.hp+35);this.leaveNode();return {message:'休息でHPを最大35回復。'};
    }
    if(facility==='rest'&&action==='forge') {
      const original=this.deck[i];
      const result=original&&upgraded(original,mode,digit);
      if(!result) return null;
      this.deck[i]=result;
      this.leaveNode();
      return {kind:'forge',sources:[original],result};
    }
    if(facility!=='shop'||!Object.hasOwn(prices,action)||this.gold<prices[action]||this.shopUsed[action]) return null;
    let transaction;
    if(action==='buy'&&this.shop[i]) {
      const result=this.shop[i];
      this.shop[i]=null;
      this.deck.push(result);
      transaction={kind:'shop',sources:[],result};
    } else if(action==='relic'&&this.stockRelics[i]) {
      const relic=this.stockRelics[i];
      this.owned.push(relic);
      transaction={kind:'relic',relic,sources:[]};
    } else if(action==='fuse'&&i!==j&&this.deck.length>12) {
      const sources=[this.deck[i],this.deck[j]];
      const result=fused(...sources);
      if(!result) return null;
      this.deck[Math.min(i,j)]=result;
      this.deck.splice(Math.max(i,j),1);
      transaction={kind:'fuse',sources,result};
    } else if(action==='remove'&&Number.isInteger(i)&&this.deck[i]&&this.deck.length>12) {
      transaction={kind:'remove',sources:this.deck.splice(i,1)};
    }
    if(!transaction) return null;
    this.gold-=prices[action];
    if(action!=='buy') this.shopUsed[action]=true;
    return {...transaction,price:prices[action]};
  }
  summary() {
    return {...this.stats,max:String(this.stats.max),stage:this.stage,seed:this.seed,
      outcome:this.phase,deck:[...this.deck],relics:[...this.owned]};
  }
}

const key='damage-breaker.v01';
function load() {
  try {
    const data=JSON.parse(localStorage.getItem(key));
    if(data&&/^\d+$/.test(data.best?.max??'')&&Array.isArray(data.runs))
      return {...data,prefs:data.prefs||{}};
  } catch {}
  return {best:{max:'0'},runs:[],prefs:{}};
}
function save(data) {
  try {localStorage.setItem(key,JSON.stringify(data));return true;}
  catch {return false;}
}


const checkpointVersion=1;
const resumablePhases=['map','battle','reward','facility','clear'];
const shopKinds=['shop','forge','fuse','relic','remove','event'];
const savedCardKinds=['add','mul','pct','pow','exp','clean','ward','guard'];
const integerBetween=(value,min,max)=>Number.isInteger(value)&&value>=min&&value<=max;
const validCard=c=>c&&savedCardKinds.includes(c.kind)&&Number.isSafeInteger(c.value)&&
  integerBetween(c.cost,1,4)&&integerBetween(c.tier,0,4);
const validCards=cards=>Array.isArray(cards)&&cards.every(validCard);
const validRelic=id=>typeof id==='string'&&Object.hasOwn(relics,id);
const nonnegativeBigInt=n=>typeof n==='bigint'&&n>=0n;
const rewardDecisions=['pending','taken','skipped'];

function writeCheckpoint({run,notice='',craftResult=null}) {
  const {rng,uncommittedCards,...state}=run;
  const returnableSlots=state.board?.flatMap((card,i)=>uncommittedCards.has(card)?[i]:[])??[];
  return JSON.stringify({version:checkpointVersion,state,randomState:rng.state(),notice,craftResult,returnableSlots},
    (_,value)=>typeof value==='bigint'?{$bigint:String(value)}:value);
}
function readCheckpoint(serialized) {
  if(typeof serialized!=='string') return null;
  try {
    const data=JSON.parse(serialized,(_,value)=>{
      if(!value||typeof value!=='object'||!Object.hasOwn(value,'$bigint')) return value;
      if(typeof value.$bigint!=='string'||! /^-?\d+$/.test(value.$bigint)) throw new TypeError('Invalid BigInt');
      return BigInt(value.$bigint);
    });
    const {version,state,randomState,notice,craftResult,returnableSlots=[]}=data;
    if(version!==checkpointVersion||!state||!integerBetween(randomState,-2147483648,2147483647)||
      !resumablePhases.includes(state.phase)||typeof state.seed!=='string'||typeof notice!=='string'||
      !integerBetween(state.act,1,4)||!integerBetween(state.stage,0,30)||!integerBetween(state.hp,1,100)||
      !Number.isSafeInteger(state.gold)||state.gold<0||!validCards(state.deck)||!state.deck.length||
      !Array.isArray(state.owned)||!state.owned.every(validRelic)||!Array.isArray(state.map)||
      !Array.isArray(state.routes)||!Array.isArray(state.visited)||!Array.isArray(state.history)||
      !Array.isArray(state.recent)||!state.recent.every(nonnegativeBigInt)||!nonnegativeBigInt(state.stats?.max)) return null;
    if(state.phase==='battle'||state.phase==='reward') {
      const e=state.enemy;
      if(!nonnegativeBigInt(e?.hp)||!nonnegativeBigInt(e.max)||e.max===0n||
        !Array.isArray(e.gates)||!e.gates.every(nonnegativeBigInt)||!Array.isArray(e.cycle)||!e.cycle.length||
        !validCards(state.hand)||!validCards(state.board)||!validCards(state.deckDraw)||!validCards(state.discard)||
        !Array.isArray(state.deb)||!integerBetween(state.maxHp,1,100)||
        (state.interceptUsed!==undefined&&typeof state.interceptUsed!=='boolean')||
        (state.guard!==undefined&&!integerBetween(state.guard,0,48))||
        (typeof state.ward!=='boolean'&&!integerBetween(state.ward,0,6))) return null;
    }
    if(state.phase==='reward'&&(!validCards(state.offers)||
      ![...rewardDecisions,'none'].includes(state.cardDecision?.status)||
      (state.cardDecision.status==='taken'&&!validCard(state.cardDecision.card))||
      !rewardDecisions.includes(state.goldDecision)||
      (state.relicAlternative!=null&&(!validRelic(state.relicAlternative)||state.relicAlternative===state.relicDrop))||
      (state.relicDecision!==null&&(!rewardDecisions.includes(state.relicDecision)||!validRelic(state.relicDrop))))) return null;
    if(craftResult&&(!shopKinds.includes(craftResult.kind)||(craftResult.result&&!validCard(craftResult.result))||
      (craftResult.kind!=='event'&&!validCards(craftResult.sources))||
      (craftResult.relic&&!validRelic(craftResult.relic)))) return null;
    if(state.phase==='battle'||state.phase==='reward') {
      const variant=state.enemy.art?.palette%6;
      state.enemy.name=encounterName(state.act,state.enemy.kind,variant)??state.enemy.name;
    }
    if(!Array.isArray(returnableSlots)||returnableSlots.some(i=>state.phase!=='battle'||
      !integerBetween(i,0,state.board.length-1)||!state.stats.usage?.[state.board[i].kind])) return null;
    state.uncommittedCards=new Set(returnableSlots.map(i=>state.board[i]));
    Object.setPrototypeOf(state,Run.prototype);
    state.rng=random(state.seed,randomState);
    return {run:state,notice,craftResult};
  } catch {
    return null;
  }
}

function paint(canvas,shape,act) {
  const ctx=canvas.getContext('2d');
  const w=canvas.width,h=canvas.height;
  ctx.translate(w/2,h/2+5);
  const gold=['#cbb483','#83beb1','#df9c82','#d5acf0'][act-1];
  const rng=random('engraving-'+shape+'-'+act);
  const line=(points,color,width=1,fill)=>{
    ctx.beginPath();
    points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
    if(fill){ctx.closePath();ctx.fillStyle=fill;ctx.fill();}
    ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();
  };
  const circle=(r,color)=>{
    ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.strokeStyle=color;ctx.lineWidth=1;ctx.stroke();
  };
  const glow=ctx.createRadialGradient(0,0,5,0,0,110);
  glow.addColorStop(0,gold+'42');glow.addColorStop(1,gold+'00');
  ctx.fillStyle=glow;ctx.fillRect(-150,-150,300,300);
  circle(76,gold+'75');circle(88,gold+'55');circle(91,gold+'55');
  for(let i=0;i<48;i++) {
    ctx.save();ctx.rotate(i*Math.PI/24);
    line([[0,-89],[0,-(i%4?84:78)]],gold+'85');
    ctx.restore();
  }
  for(let i=0;i<110;i++) {
    const x=(rng()-.5)*w,y=(rng()-.5)*h;
    ctx.fillStyle=gold+(rng()<.15?'ad':'35');
    ctx.fillRect(x,y,1+rng(),1+rng());
  }
  const profile=shape===2?
    [[0,-46],[15,-51],[36,-74],[31,-38],[57,-56],[48,-21],[36,-4],[47,13],[74,31],[58,67],[0,81]]:
    shape===1?[[0,-63],[20,-51],[35,-31],[33,3],[52,14],[76,48],[59,70],[0,77]]:
    [[0,-65],[14,-56],[37,-29],[44,7],[63,28],[74,64],[39,73],[0,77]];
  const mirror=points=>[...points,...points.slice(1,-1).reverse().map(([x,y])=>[-x,y])];
  line(mirror(profile),gold,1.6,'#161d19');
  for(const side of [-1,1]) {
    ctx.save();ctx.scale(side,1);
    line([[1,-52],[18,-39],[30,-10],[25,17],[59,39],[43,65],[14,70]],gold+'b0',1,'#323a2c');
    line([[29,5],[41,24],[60,41],[43,47],[31,65],[17,46]],gold+'a0',1,'#20251f');
    for(let i=0;i<13;i++) line([[28+i*2,30+i*1.4],[19+i*2,51+i*.75]],gold+'44');
    line([[3,-18],[23,-23],[19,-12],[5,-10]],gold,1,gold+'a8');
    ctx.restore();
  }
  line([[0,-43],[9,-22],[0,3],[-9,-22]],gold,1,'#101612');
  line(mirror([[0,16],[18,29],[14,51],[0,68]]),gold,1,'#202921');
  line([[0,24],[7,36],[0,49],[-7,36],[0,24]],gold,1,gold+'80');
}

function drawFace(context,form,palette,x,y,scale,colors) {
  const draw=faces[form]?.[palette];
  if(!draw) return;
  const color={...colors,edge:'#100f1b',void:'#090813',white:'#fff5dc',ivory:'#d6c4a8',
    fire:'#ffc271',mint:'#8be6e0',rust:'#af654e'};
  const p=(tone,points)=>{
    context.fillStyle=color[tone];
    context.beginPath();
    context.moveTo(x+points[0]*scale,y+points[1]*scale);
    for(let i=2;i<points.length;i+=2) {
      context.lineTo(x+points[i]*scale,y+points[i+1]*scale);
    }
    context.closePath();
    context.fill();
  };
  const b=(tone,dx,dy,w,h)=>{
    context.fillStyle=color[tone];
    context.fillRect(x+dx*scale,y+dy*scale,w*scale,h*scale);
  };
  const d=(tone,dx,dy,r)=>p(tone,[dx,dy-r,dx+r,dy,dx,dy+r,dx-r,dy]);
  draw({p,b,d});
}

function magnitude([n,d]) {

function divisorRelic(step) {
  if(!step.card.enemy||step.card.kind!=='div') return null;
  if(!step.op) return 'key';
  return step.op.kind==='mul'?'prism':null;
}
function relicActivations(result) {
  const ids=new Set();
  for(const step of result.steps) {
    const id=divisorRelic(step);
    if(id) ids.add(id);
  }
  for(const trigger of result.triggers) ids.add(trigger.id);
  return ids;
}
function boardRelicStates(owned,preview,lastBurst) {

  return owned.flatMap(id=>{
    const relic=relics[id];
    if(!relic) return [];
    const fixed=!relic.effect&&id!=='key'&&id!=='prism';
    return fixed||ready.has(id)||fired.has(id)?
      [{id,fixed,ready:ready.has(id),fired:fired.has(id)}]:[];
  });
}
function timeline(result,armor) {
  let combo=0;
  const steps=result.steps.map((step,index)=>{
    if(!step.card.enemy && step.op) combo++;
    const type=step.card.enemy?'enemy':step.op?'card':'enemy';
    const operation=step.op?label(step.op):label(step.card)+' 無効';
    const relic=divisorRelic(step);
    const name=relic?relics[relic].name+' · '+operation:operation;
    return {index,type:relic?'relic':type,name,value:step.result,combo,...(relic?{relic}:{})};
  });
  for(const trigger of result.triggers) {
    steps.push({type:'relic',name:relics[trigger.id].name+' · '+label(trigger.op),value:trigger.result,combo,relic:trigger.id});
  }
  steps.push({type:'impact',name:armor>1?'装甲 ÷'+armor+' · ダメージ確定':'ダメージ確定',value:[result.final,1n],combo});
  return steps;
}
// For exact integer endpoints of a similar order, interpolate with integer arithmetic.
function reelValue([from,fd],[to,td],tick) {
  if(tick>=12) return [to,td];
  if(tick<=0) return [from,fd];
  if(fd!==1n||td!==1n||from<0n||to<0n) return [from,fd];
  const delta=to-from;
  if(delta<=0n) return [from+delta*BigInt(tick)/12n,1n];
  const digits=to.toString().length-from.toString().length;
  if(digits>=3) {
    const shift=Math.ceil(digits*(12-tick)/12);
    const candidate=to/10n**BigInt(shift);
    return [candidate>from?candidate:from,1n];
  }
  return [from+delta*BigInt(tick)/12n,1n];
}


function impactForce({final,impact}) {
  if(impact.kind==='miss') return 'none';
  if(impact.kind==='barrier') return 'ward';
  if(impact.kind==='gate') return 'break';
  const level=magnitude([final,1n]);
  if(level===7) return 'infinity';
  return level>=3?'great':'standard';
}

function createSound(Context, settings) {
  let ctx, master;
  function unlock() {
    if(!Context||settings().mute) return;
    try {
      if(!ctx) {
        ctx=new Context();
        master=ctx.createGain();
        master.connect(ctx.destination);
      }
      if(ctx.state==='suspended') void ctx.resume().catch(()=>{});
    } catch {}
  }
  function refresh() {
    if(!master) return;
    const {mute,volume}=settings();
    master.gain.value=mute?0:(typeof volume==='number'?Math.min(1,Math.max(0,volume/100)):.55);
  }
  function play(id,{level=0,signal,fast=false}={}) {
    if(!master||settings().mute||signal?.aborted) return;
    refresh();
    const stretch=fast ? .64 : 1;
    const pitch=2**(Math.min(7,Math.max(0,level))/10);
    for(const [from,to,offset,length,strength,shape] of cues[id]??[]) {
      const voice=ctx.createOscillator(), body=ctx.createGain();
      const at=ctx.currentTime+offset*stretch, duration=length*stretch;
      voice.type=shape;
      voice.frequency.setValueAtTime(from*pitch,at);
      voice.frequency.exponentialRampToValueAtTime(to*pitch,at+duration);
      body.gain.setValueAtTime(.0001,at);
      body.gain.exponentialRampToValueAtTime(strength,at+.008);
      body.gain.exponentialRampToValueAtTime(.0001,at+duration);
      voice.connect(body);
      body.connect(master);
      const cancel=()=>voice.stop();
      signal?.addEventListener('abort',cancel,{once:true});
      voice.onended=()=>{
        signal?.removeEventListener('abort',cancel);
        voice.disconnect();
        body.disconnect();
      };
      voice.start(at);
      voice.stop(at+duration+.01);
    }
  }
  return {unlock,play,refresh};
}

const cardCue=c=>({guard:'ward',ward:'ward',clean:'clean',mul:'multiply',pct:'multiply',pow:'mystic',exp:'mystic'}[c.kind]||'place');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const fmt=(n,cap=true)=>format(n,book.prefs.scientific,cap);
const exactRat=([n,d])=>d===1n?String(n):n+' / '+d;
const rat=([n,d])=>d===1n?fmt(n,false):fmt(n,false)+' / '+fmt(d,false);
const compact=(n,cap=true)=>{
  if(cap&&n>CAP) return '∞';
  const abs=n<0n?-n:n;
  if(book.prefs.scientific||abs<10000n||abs>CAP) return fmt(n,cap);
  const unit=10n**BigInt((Math.ceil(abs.toString().length/4)-1)*4);
  const leading=abs/unit;
  const fractional=String((abs%unit)*100n/unit).padStart(2,'0').replace(/0+$/,'');
  return ((abs%unit)*100n%unit?'≈':'')+(n<0n?'−':'')+String(leading)+(fractional?'.'+fractional:'')+format(unit,false,false).slice(1);
};
const visibleNumber=([n,d])=>d===1n?compact(n,false):compact(n,false)+' / '+compact(d,false);
const btn=(title,act,cls='',disabled=false)=>`<button type="button" data-action="${act}" class="${cls}" ${disabled?'disabled':''}>${title}</button>`;
const types={add:'加算',mul:'乗算',pct:'割合',exp:'指数',pow:'累乗',clean:'浄化',ward:'結界',guard:'防御'};
const glyph={add:'✦',mul:'✧',pct:'◈',pow:'❖',exp:'✷',clean:'✤',ward:'◇',guard:'⬟'};
const cardEffect=c=>{
  if(c.kind==='clean') return '盤の妨害を先頭から'+supportValue(c)+'枚解除';
  if(c.kind==='ward') return '妨害 '+supportValue(c)+'回を無効化';
  if(c.kind==='guard') return '次の攻撃を '+supportValue(c)+' 軽減';
  return types[c.kind];
};
const cardFace=c=>`<span class="card-rank">${rarity[c.tier]}</span><span class="mana" title="消費エネルギー">${c.cost}</span>
  <span class="sigil" aria-hidden="true">${glyph[c.kind]||'◇'}</span><strong class="card-number">${label(c)}${c.upgraded?'✧':''}</strong>
  <span class="card-type">${cardEffect(c)||'妨害'}</span>`;
const cardButton=(c,act,i=-1,disabled=false)=>`<button type="button" class="card t${c.tier}" data-action="${act}"
  ${i<0?'':`draggable="${!disabled}" data-hand="${i}"`} title="${cardEffect(c)}・消費 ${c.cost}" ${disabled?'disabled':''}>
  ${cardFace(c)}</button>`;
function persist(){storageWarning=!save(book);}
function saveProgress() {
  const finished=run.phase==='loss'||run.phase==='win';
  if(finished||run.phase==='clear') rememberRun();
  suspended=finished?null:{run,notice,craftResult};
  book.checkpoint=suspended?writeCheckpoint(suspended):null;
  persist();
}
function modal(title,content) {
  dialog.className='';
  dialog.innerHTML=`<h2>${title}</h2>${content}<form method="dialog"><button>閉じる</button></form>`;
  if(!dialog.open) dialog.showModal();
}
function routeName(act=run.act){return act===4?'EXTRA':'ACT '+['','I','II','III'][act];}
const rankMark=id=>`<span class="relic-rank r${relics[id].rank}">${relicRanks[relics[id].rank].name}</span>`;
function intentText(a=run.next) {
  if(a.kind==='attack') return `HPに ${a.value} ダメージ`;
  const pattern=attackPatterns[a.kind];
  if(pattern) {
    const hits=attackHits(a);
    const hit=hits>1?`${a.value} × ${hits} ダメージ`:hits?`${a.value} ダメージ`:'';
    const penalty={jam:'次のドロー −1',tax:'次のエナジー −1',fracture:'指定位置の次の演算を1枚封印',scorch:`演算盤に −${20*run.act}`}[pattern.penalty];
    return pattern.name+' · '+[hit,penalty].filter(Boolean).join(' ＋ ');
  }
  if(a.kind==='wither') return `吸命 · 戦闘中の最大HP −${a.value}（下限35）`;
  if(a.kind==='drain') return `弱体 · 戦闘中の基礎値 −${a.value}%`;
  if(a.kind==='lock') return `封印 · 次のBURSTまで${operationNames[a.target]}を無効化`;
  return `${a.at}枠目の後に ${label(a)} を挿入${run.ward?'（結界で防御可能）':''}`;
}
function pager(page,pages,attribute) {
  if(pages<=1) return '';
  return `<div class="pager"><button type="button" ${attribute}="${page-1}" aria-label="前のページ" ${page===0?'disabled':''}>‹</button>
    <small>${page+1} / ${pages}</small><button type="button" ${attribute}="${page+1}" aria-label="次のページ" ${page===pages-1?'disabled':''}>›</button></div>`;
}
function baseBanner(gain=baseGlow) {
  if(!gain) return '';
  return `<p class="base-banner" role="status"><span class="base-spark" aria-hidden="true">✦</span>
    <span>基礎値上昇 <del>${gain.from}</del> → <strong>${gain.to}</strong></span><b>+${gain.to-gain.from}</b></p>`;
}
function markBaseGain(from) {
  const to=run.baseAt();
  if(to>from) {baseGlow={from,to};cue('ascend');}
}
function relicBadge(id,status,style='',inBoard=false) {
  const relic=relics[id];
  const description=esc(`${relic.name}（${status}） · ${relic.desc}`);
  return `<button type="button" class="relic-badge ${style}" data-action="relic:${id}" data-relic="${id}"
    ${inBoard?'data-board-relic':''} aria-label="${description}">
    ${relicIcon(id)}<i aria-hidden="true"></i><span class="relic-tip" aria-hidden="true">
      <b>${esc(relic.name)}</b> ${rankMark(id)}<small>${status} · ${esc(relic.desc)}</small></span></button>`;
}
function relicStrip(p,firing=false) {
  const entries=boardRelicStates(run.owned,p,firing?null:run.lastBurst);
  return entries.map(({id,fixed,ready,fired})=>relicBadge(id,
    fixed?'常時・開幕効果':ready&&fired?'発動予定・直前に発動':ready?'発動予定':'直前に発動',
    fixed?'relic-fixed':fired?'relic-lit':'relic-ready-icon',true)).join('');
}

function openRelicCollection() {
  modal('所持レリック '+run.owned.length,`<div class="relic-options">${run.owned.map(id=>
    `<article class="relic-option"><h3>${relicIcon(id)} ${esc(relics[id].name)} ${rankMark(id)}</h3><p>${esc(relics[id].desc)}</p></article>`).join('')}</div>`);
}
function damageReceipt() {
  const p=run.lastBurst;
  if(!p) return '';
  const kind=p.impact.kind, status=kind==='barrier'?'バリアで無効':kind==='gate'?'耐久段階を突破':kind==='miss'?'ダメージなし':'';
  const fired=[...relicActivations(p)].map(id=>relics[id].name);
  return `<section class="damage-receipt" aria-label="直前の攻撃結果">
    <div><small>確定BURST</small><strong title="${p.final}">${compact(p.final)}</strong></div>
    <div><small>敵HPの減少</small><strong title="${p.impact.dealt}">${compact(p.impact.dealt,false)}</strong>${status?`<small>${status}</small>`:''}</div>
    ${fired.length?`<p class="relic-receipt">✦ 発動レリック　${fired.join(' ／ ')}</p>`:''}</section>`;
}
function tacticalReadout(p) {
  const outcome=run.enemyOutcome();
  const held=run.holdPreview(outcome);
  const lethal=!outcome.hp;
  const victory=p.impact.dealt===run.enemy.hp;
  const holdText=run.holds>=2?'HOLD上限':lethal?'反撃で敗北':
    outcome.hp<run.hp?'HP −'+(run.hp-outcome.hp):outcome.maxHp<run.maxHp?'最大HP −'+(run.maxHp-outcome.maxHp):
    outcome.drain!==run.drain?'基礎 '+run.base+' → '+run.baseAt(outcome.drain):
    outcome.drawPenalty?'次のドロー −1':outcome.energyPenalty?'次のエナジー −1':outcome.deb!==run.deb?'妨害が盤に入る':outcome.blocked||outcome.absorbed?'HP変化なし':'追加の変化なし';
  const burstText=victory?'このBURSTで撃破':p.impact.kind==='gate'?'耐久段階を突破':
    p.impact.kind==='barrier'?'バリアを1枚破る':p.impact.kind==='miss'?'攻撃が通らない':'敵HP −'+compact(p.impact.dealt,false);
  return `<div class="tactics" aria-label="HOLDとBURSTの比較">
    <div class="${lethal&&run.holds<2?'tactics-danger':''}"><b>HOLD</b><span>${holdText}${outcome.blocked&&run.holds<2&&!lethal?' · 結界で妨害を防ぐ':''}${outcome.absorbed&&run.holds<2?' · 防御 '+outcome.absorbed:''}${held!==null&&held!==p.final?` <small title="${held}"> · 引く前の予測 ${compact(held)}</small>`:''}</span></div>
    <div class="${victory?'tactics-win':lethal?'tactics-danger':''}"><b>BURST</b><span>${burstText}${lethal&&!victory?' · 反撃で敗北':''}</span></div></div>`;
}
const enemyNameHTML=name=>name.split(/(?<=・)/u).map(part=>`<span class="enemy-name-part">${esc(part)}</span>`).join('<wbr>');
function battle() {

  const slots=Array.from({length:run.slots},(_,i)=>{
    const c=run.board[i];

    const at=Math.min(i,run.board.length);
    const deb=i<=run.board.length?run.deb.filter(d=>Math.min(d.at,run.board.length)===i).map(d=>

      `<button type="button" class="slot empty" data-at="${at}" data-action="slot:${at}" aria-label="空き枠 ${i+1}">${i+1}</button>`);

  const tail=run.board.length===run.slots?run.deb.filter(d=>d.at>=run.slots).map(d=>`<span class="slot debuff" data-calc="${p.steps.findIndex(s=>s.card===d)}">${label(d)}</span>`).join(''):'';
  return `<main class="battle"><div class="column">
    <section class="frame enemy" data-act="${run.act}" data-rank="${e.kind}" data-form="${e.art.form}">
      <div class="enemy-identity"><div class="eyebrow">${routeName()} · 第${run.stage}地点</div>

        <figure class="combatant hero"><canvas data-sprite="10" width="48" height="44" aria-hidden="true"></canvas>
        <figcaption>術師</figcaption><div class="hpBar hero-hp" aria-hidden="true"><span style="width:${100*run.hp/run.maxHp}%"></span></div><small id="heroHp">HP ${run.hp} / ${run.maxHp}</small></figure>
        <span class="arena-seal" aria-hidden="true">✧</span>
        <figure class="combatant foe"><canvas data-enemy-art width="88" height="64" aria-hidden="true"></canvas>
        <figcaption>敵</figcaption><div class="hpBar foe-hp" aria-hidden="true"><span style="width:${Number(e.hp*1000n/e.max)/10}%"></span></div><small id="foeHp" title="${e.hp} / ${e.max}">HP ${compact(e.hp)} / ${compact(e.max)}</small></figure>
        <span class="burst-scene" aria-hidden="true"><i class="burst-seal"></i><i class="burst-bolt"></i>
          <i class="burst-ring"></i><i class="burst-ring echo"></i></span>
        ${e.kind==='boss'?`<div class="boss-entry" aria-hidden="true"><i></i><span>ACT BOSS</span><strong>${enemyNameHTML(e.name)}</strong></div>`:''}
        <span class="boss-attack" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="intercept-arc" aria-hidden="true"></span><span class="slash" aria-hidden="true"></span><span class="enemy-cast" aria-hidden="true"></span><span id="incoming" aria-hidden="true"></span><span id="outgoing" aria-hidden="true"></span>
      </div>
      <div class="enemy-info">
      ${e.detail?`<p class="enemy-rule">${e.detail}</p>`:''}
      ${e.barrier||gate!==undefined?`<p class="enemy-rule defense-status">${e.barrier?'バリア残り '+e.barrier+'回':`耐久段階あと ${e.gates.length} · 次の突破に <b title="${e.hp-gate}">${compact(e.hp-gate,false)}</b> ダメージ`}</p>`:''}
      <div class="intent" data-move="${run.next.kind}"><small>敵の次の行動</small><strong>${intentText()}</strong></div></div></section>
    <section class="frame board-frame"><div class="heading"><h2>演算盤</h2><small>${run.board.length} / ${run.slots} 枠 · コンボ ${run.board.length}${run.wardCharges?' · 結界 '+run.wardCharges:''}${run.guardPoints?' · 防御 '+run.guardPoints:''}</small></div>
      <div class="board-relics" aria-label="演算盤のレリック">${relicStrip(p)}</div>
      <div class="board"><span class="slot base${baseGlow?' base-awaken':''}"><small>基礎</small>${run.base}</span>${slots}${tail}</div>
      ${selected!==null?`<div class="actions" style="margin-top:8px">${btn('← 左へ','shift:-1','',selected===0)}${btn('右へ →','shift:1','',selected===run.board.length-1)}${run.canReturn(selected)?btn('手札に戻す','unplay'):''}</div>`:''}

      <small id="intercept-condition">${interceptBlock?`迎撃 · ${interceptBlock}`:`迎撃 · 消費1／この戦闘で1回 · HP損失を${interceptBenefit}軽減`}</small></div></section>
    </div>${sidebar(p)}</main>`;
}
const chapter=(tag,title,body)=>`<main><section class="frame chapter"><div class="eyebrow">${tag}</div><h1>${title}</h1>${body}</section></main>`;
const workshopThemes={
  forge:{symbol:'⚒',title:'鍛冶炉の刻印',done:'カードを強化しました'},
  shop:{symbol:'⚖',title:'旅商人の取引',done:'30金貨を支払い、カードを獲得しました'},
  fuse:{symbol:'◈',title:'錬成陣の結合',done:'素材2枚を新しいカードにしました'},
  relic:{symbol:'✧',title:'秘宝の譲渡',done:'レリックを獲得しました'},
  remove:{symbol:'♜',title:'刻印の消去',done:'デッキからカードを削除しました'}
};
const rewardCard=c=>`<div class="card result-card t${c.tier}">${cardFace(c)}</div>`;
function rewardChanges({hp,gold}) {
  const delta=(name,n)=>n?`<span>${name} <strong>${n>0?'+':'−'}${Math.abs(n)}</strong></span>`:'';
  return `<div class="reward-changes">${delta('HP',hp)}${delta('金貨',gold)}</div>`;
}
function cardReward() {
  const {status,card}=run.cardDecision;
  if(status==='none') return '';
  return `<section class="reward-block"><h2>演算パネル</h2>${
    status==='pending'?`<p>獲得するパネルを1枚選ぶか、見送れます。</p><div class="choices">${run.offers.map((c,i)=>cardButton(c,'take:'+i)).join('')}</div>

      status==='taken'?`<div class="reward-result">${rewardCard(card)}<p><strong>取得済み</strong><br>デッキに ${label(card)} を追加しました。</p></div>`:

function goldReward() {
  const status=run.goldDecision;
  return `<section class="reward-block reward-gold"><div><h2>金貨</h2><p><strong>${run.goldReward}</strong> 枚
    ${status==='taken'?' · 取得済み':status==='skipped'?' · 見送り済み':''}</p></div>
